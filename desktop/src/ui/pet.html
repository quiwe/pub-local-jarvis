<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Jarvis Pet</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="bubble" class="speech-bubble interactive" role="status" hidden>
    <div class="bubble-head"><span class="signal-dot"></span><strong>JARVIS</strong></div>
    <p id="bubble-text"></p>
    <button id="bubble-action" type="button" hidden>打开课程总结</button>
  </div>

  <div id="pet" class="pet interactive" data-scene="other" aria-label="AI 贾维斯桌宠">
    <div class="antenna"><i></i></div>
    <div class="ear left"></div><div class="ear right"></div>
    <div class="head">
      <div class="brow left"></div><div class="brow right"></div>
      <div class="eye left"><i></i></div><div class="eye right"><i></i></div>
      <div class="mouth"><span></span><span></span><span></span></div>
    </div>
    <div class="neck"></div>
    <div class="body-core">
      <button id="privacy-toggle" class="core-ring" type="button"
        title="双击屏蔽或恢复画面" aria-label="双击屏蔽或恢复画面"><span>J</span></button>
      <i class="status-light one"></i><i class="status-light two"></i>
    </div>
    <div class="shadow"></div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
