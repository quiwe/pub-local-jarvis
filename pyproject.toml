[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aijarvis-backend"
version = "0.1.0"
description = "Local-first AI Jarvis control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
llm = ["anthropic>=0.116,<1"]

[project.scripts]
jarvis-backend = "jarvis_backend.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
