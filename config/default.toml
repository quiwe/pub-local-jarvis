[app]
name = "AI Jarvis"
environment = "development"
log_level = "INFO"

[server]
host = "127.0.0.1"
port = 8000

[native]
mode = "fake" # set to "process" for the Windows named-pipe worker
protocol_version = 1
pipe_name = "\\\\.\\pipe\\AIJarvis.Worker.v1"
worker_path = "build/native/Release/jarvis-native-worker.exe"
model_path = "models/MiniCPM-o-4_5-gguf"
request_timeout_seconds = 5.0
heartbeat_interval_seconds = 10.0
max_frame_bytes = 8388608

[scene]
enter_threshold = 0.72
exit_threshold = 0.48
enter_samples = 3
exit_samples = 4

[barrage]
max_age_seconds = 8.0
max_queue_size = 256

[interaction]
ordinary_bubble_cooldown_seconds = 20.0
course_bubble_cooldown_seconds = 90.0
game_barrage_repeat_seconds = 12.0
game_barrage_output_ratio = 0.667

[memory]
root = "memory"

[courses]
sessions_root = "courses/sessions"
keyframe_min_interval_seconds = 30
max_keyframes = 40
exit_grace_seconds = 45
exit_samples = 4
# Leave output_root unset to export through the Windows Known Folder Desktop path.
